<?xml version="1.0" encoding="UTF-8"?>
<!--
  score_markers.svg — 2 player-tinted score markers.

  Source spec sections:
    - UI_SPEC §1.1 (player panels), §6.1 (scoreUpdated animation)
    - assets/MISSING.md §1 (score markers — generated SVG)

  32×32 per pawn (64×64 retina). Sprite layout: white | black, side-by-side.
  CSS-only fallback in hexpionage.css renders identical-looking pawns
  procedurally; this SVG provides a richer raster source if needed.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="32" viewBox="0 0 64 32">
  <!-- White player marker: light fill, dark stroke. -->
  <g transform="translate(0,0)">
    <circle cx="16" cy="16" r="14" fill="#f5f5f5" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="16" cy="16" r="10" fill="none" stroke="#cccccc" stroke-width="1"/>
  </g>

  <!-- Black player marker: dark fill, light stroke. -->
  <g transform="translate(32,0)">
    <circle cx="16" cy="16" r="14" fill="#1a1a1a" stroke="#f5f5f5" stroke-width="2"/>
    <circle cx="16" cy="16" r="10" fill="none" stroke="#444444" stroke-width="1"/>
  </g>
</svg>
